<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon Script Hub - TikTok Key Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #121216;
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            position: relative;
            overflow: hidden;
        }
        /* Lớp nền Slideshow 10 ảnh tự động chạy */
        .bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .bg-slide.active {
            opacity: 1;
        }
        /* Lớp phủ tối để nổi bật khung chính */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85));
            z-index: -1;
        }
        .container { 
            background-color: rgba(28, 28, 36, 0.85); 
            backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.8); 
            width: 360px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1;
        }
        h2 { margin-bottom: 10px; font-size: 20px; color: #ff0050; }
        p { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .btn-tiktok { background-color: #ff0050; color: white; }
        .btn-tiktok:hover { background-color: #e00045; }
        .btn-copy { background-color: #00aa55; color: white; display: none; }
        .key-box { background-color: rgba(20, 20, 20, 0.9); padding: 10px; border-radius: 6px; font-family: monospace; font-size: 16px; color: #00ffcc; margin-bottom: 20px; word-break: break-all; display: none; border: 1px dashed #444; }
        #timerText { color: #ffcc00; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Khung chứa 10 ảnh nền tự động chuyển động -->
    <div class="bg-slider" id="bgSlider"></div>
    <div class="overlay"></div>

    <div class="container">
        <h2>TikTok Verification</h2>
        <p id="instruction">Follow our TikTok to unlock your daily key.</p>

        <!-- Nút dẫn sang TikTok -->
        <a href="https://www.tiktok.com/@your_tiktok_id" target="_blank" id="tiktokBtn" class="btn btn-tiktok" onclick="startTimer()">1. Follow on TikTok</a>

        <div id="timerText"></div>

        <!-- Khung hiển thị Key -->
        <div class="key-box" id="keyDisplay">Loading...</div>
        <button class="btn btn-copy" id="copyBtn" onclick="copyKey()">2. Copy Key</button>
    </div>

    <script>
        // Danh sách 10 hình nền (Bao gồm bức ảnh chủ đạo của bạn và 9 ảnh nền game/cyberpunk cực ngầu khác)
        const images = [
            "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1920&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop"
        ];

        const slider = document.getElementById("bgSlider");
        let currentIndex = 0;

        // Tạo các thẻ div background động
        images.forEach((imgUrl, index) => {
            const slide = document.createElement("div");
            slide.className = "bg-slide" + (index === 0 ? " active" : "");
            slide.style.backgroundImage = `url('${imgUrl}')`;
            slider.appendChild(slide);
        });

        const slides = document.querySelectorAll(".bg-slide");

        // Tự động đổi ảnh mỗi 6 giây
        setInterval(() => {
            slides[currentIndex].classList.remove("active");
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add("active");
        }, 6000);

        // Logic hệ thống Key
        const dailyKey = "BACON_" + String(new Date().getDate()).padStart(2, '0') + "_VIP";
        
        window.onload = function() {
            if (localStorage.getItem("tiktok_verified") === "true") {
                unlockKey();
            }
        }

        function startTimer() {
            if (localStorage.getItem("tiktok_verified") === "true") return;
            
            let timeLeft = 10;
            const tiktokBtn = document.getElementById("tiktokBtn");
            const timerText = document.getElementById("timerText");
            
            tiktokBtn.style.opacity = "0.6";
            tiktokBtn.innerText = "Checking TikTok...";
            
            let countdown = setInterval(() => {
                timerText.innerText = "Please wait on TikTok: " + timeLeft + "s remaining...";
                timeLeft--;
                
                if (timeLeft < 0) {
                    clearInterval(countdown);
                    timerText.innerText = "Verification Successful!";
                    localStorage.setItem("tiktok_verified", "true");
                    unlockKey();
                }
            }, 1000);
        }

        function unlockKey() {
            document.getElementById("tiktokBtn").style.display = "none";
            document.getElementById("timerText").style.display = "none";
            document.getElementById("instruction").innerText = "Your key is ready!";
            
            document.getElementById("keyDisplay").innerText = dailyKey;
            document.getElementById("keyDisplay").style.display = "block";
            
            const copyBtn = document.getElementById("copyBtn");
            copyBtn.style.display = "block";
        }

        function copyKey() {
            navigator.clipboard.writeText(dailyKey).then(() => {
                alert("Key copied: " + dailyKey);
            });
        }
    </script>

</body>
</html>
