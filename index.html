<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon Hub - Get Key System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-no-repeat: center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            transition: background-image 0.5s ease-in-out;
        }

        /* Lớp phủ tối giúp rõ giao diện card */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #b0b0b0;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .step-box {
            display: none;
        }

        .step-box.active {
            display: block;
        }

        .btn {
            background: #fe2c55;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4);
            margin-bottom: 15px;
            text-decoration: none;
            display: block;
        }

        .btn:hover {
            background: #e11d43;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .timer-text {
            color: #ffcc00;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .key-box {
            background: rgba(15, 15, 15, 0.9);
            border: 1.5px dashed #fe2c55;
            border-radius: 12px;
            padding: 15px;
            font-size: 20px;
            font-weight: 700;
            color: #00ff88;
            word-break: break-all;
            margin-bottom: 15px;
            user-select: all;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BACON HUB</h1>
        <p class="subtitle">Hệ thống lấy Key tự động</p>

        <!-- Bước 1: Yêu cầu Follow TikTok -->
        <div id="step1" class="step-box active">
            <p style="font-size: 14px; margin-bottom: 20px; color: #ddd;">Bạn cần Follow TikTok <b style="color: #fe2c55;">@huy.nguyn.bacon</b> để mở khóa Key.</p>
            <a href="https://www.tiktok.com/@huy.nguyn.bacon" target="_blank" class="btn" id="tiktokBtn" onclick="startTimer()">FOLLOW TIKTOK ĐỂ LẤY KEY</a>
            <div id="timerText" class="timer-text">Vui lòng chờ 10s trên TikTok...</div>
        </div>

        <!-- Bước 2: Hiện Key sau khi đếm ngược xong -->
        <div id="step2" class="step-box">
            <p style="font-size: 14px; margin-bottom: 10px; color: #00ff88;">✔ Đã xác nhận hoàn thành!</p>
            <div class="key-box" id="keyDisplay">Đang tải...</div>
            <button class="btn" id="copyBtn" onclick="copyKey()">SAO CHÉP KEY</button>
        </div>

        <div class="footer">
            make by huy.nguyn.bacon
        </div>
    </div>

    <script>
        // Danh sách 14 hình nền ngẫu nhiên chất lượng cao
        const backgrounds = [
            'https://i.pinimg.com/564x/fc/42/c4/fc42c402524859f1a5e0c952c25b69a3.jpg',
            'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop'
        ];

        // Tự động lấy 1 hình nền ngẫu nhiên khi load trang
        window.onload = function() {
            const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
            document.body.style.backgroundImage = `url('${randomBg}')`;
        }

        let isCounting = false;

        function startTimer() {
            if (isCounting) return;
            isCounting = true;

            const tiktokBtn = document.getElementById("tiktokBtn");
            const timerText = document.getElementById("timerText");

            tiktokBtn.style.opacity = "0.6";
            tiktokBtn.style.pointerEvents = "none";
            timerText.style.display = "block";

            let timeLeft = 10;
            timerText.innerText = "Vui lòng chờ trên TikTok: " + timeLeft + "s...";

            let countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerText.innerText = "Vui lòng chờ trên TikTok: " + timeLeft + "s...";
                } else {
                    clearInterval(countdown);
                    showKeyStep();
                }
            }, 1000);
        }

        function showKeyStep() {
            document.getElementById("step1").classList.remove("active");
            document.getElementById("step2").classList.add("active");
            
            // Tính toán Key đồng bộ thời gian thực theo từng giờ
            let timeBlock = Math.floor(Date.now() / 1000 / 3600);
            let secretCode = (timeBlock * 16253) % 90000 + 10000;
            let currentKey = "ssaa_" + secretCode;
            
            document.getElementById("keyDisplay").innerText = currentKey;
        }

        function copyKey() {
            let keyText = document.getElementById("keyDisplay").innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                let btn = document.getElementById("copyBtn");
                btn.innerText = "ĐÃ SAO CHÉP!";
                btn.style.background = "#00b894";
                setTimeout(() => {
                    btn.innerText = "SAO CHÉP KEY";
                    btn.style.background = "#fe2c55";
                }, 2000);
            });
        }
    </script>
</body>
</html>
