<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon Script Hub - Key System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121216; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background-color: #1c1c24; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 380px; text-align: center; }
        h2 { margin-bottom: 10px; font-size: 20px; color: #ff0050; }
        p { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .btn-tiktok { background-color: #ff0050; color: white; }
        .btn-tiktok:hover { background-color: #e00045; }
        .btn-copy { background-color: #00aa55; color: white; display: none; }
        .key-box { background-color: #282833; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 16px; color: #00ffcc; margin-bottom: 20px; word-break: break-all; display: none; }
        #statusText { color: #ffcc00; font-weight: bold; margin-bottom: 15px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>TikTok Verification</h2>
        <p id="instruction">Complete the steps below to unlock your key.</p>

        <!-- Nút chuyển hướng sang TikTok -->
        <a href="https://www.tiktok.com/@your_tiktok_id" target="_blank" id="actionBtn" class="btn btn-tiktok" onclick="verifyProcess()">1. Follow on TikTok</a>

        <!-- Dòng thông báo trạng thái -->
        <div id="statusText"></div>

        <!-- Khung chứa Key (ban đầu ẩn) -->
        <div class="key-box" id="keyDisplay">Generating...</div>
        <button class="btn btn-copy" id="copyBtn" onclick="copyKey()">2. Copy Key</button>
    </div>

    <script>
        const dailyKey = "BACON_" + String(new Date().getDate()).padStart(2, '0') + "_VIP";
        
        // Tự động kiểm tra nếu thiết bị này đã vượt link trước đó (lần sau vào không cần làm lại)
        window.onload = function() {
            if (localStorage.getItem("tiktok_verified") === "true") {
                showSuccessState();
            }
        }

        function verifyProcess() {
            if (localStorage.getItem("tiktok_verified") === "true") return;

            const actionBtn = document.getElementById("actionBtn");
            const statusText = document.getElementById("statusText");
            
            actionBtn.style.pointerEvents = "none";
            actionBtn.style.opacity = "0.5";
            actionBtn.innerText = "Verifying...";

            let timeLeft = 8; // Thời gian đếm ngược kiểm tra thao tác
            
            let countdown = setInterval(() => {
                statusText.innerText = "Checking activity: " + timeLeft + "s remaining...";
                timeLeft--;
                
                if (timeLeft < 0) {
                    clearInterval(countdown);
                    statusText.style.color = "#00ffcc";
                    statusText.innerText = "Successfully! Redirecting to get key...";
                    
                    // Lưu trạng thái để các lần sau vào không cần follow lại nữa
                    localStorage.setItem("tiktok_verified", "true");
                    
                    setTimeout(() => {
                        showSuccessState();
                    }, 1200); // Đợi 1.2 giây hiện thông báo rồi chuyển về giao diện lấy key
                }
            }, 1000);
        }

        function showSuccessState() {
            document.getElementById("actionBtn").style.display = "none";
            document.getElementById("statusText").style.display = "none";
            document.getElementById("instructioninnerText", "Your key is ready below!");
            document.getElementById("instruction").innerText = "Successfully! Here is your key:";
            
            document.getElementById("keyDisplay").innerText = dailyKey;
            document.getElementById("keyDisplay").style.display = "block";
            
            const copyBtn = document.getElementById("copyBtn");
            copyBtn.style.display = "block";
        }

        function copyKey() {
            navigator.clipboard.writeText(dailyKey).then(() => {
                alert("Key copied successfully: " + dailyKey);
            });
        }
    </script>

</body>
</html>
