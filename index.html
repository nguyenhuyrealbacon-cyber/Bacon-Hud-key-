<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon Hub - Key System</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1f1f1f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        h2 { margin-bottom: 20px; color: #ff5252; }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:hover { background-color: #2980b9; }
        .admin-btn {
            background-color: transparent;
            color: #888;
            border: none;
            font-size: 12px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: underline;
        }
        .key-box {
            background: #2b2b2b;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            word-break: break-all;
            font-family: monospace;
            color: #00ff88;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>BACON HUB</h2>
    <p>Hoàn thành vượt link để lấy key sử dụng trong game.</p>
    
    <!-- Link vượt link chính của bạn (có thể thay đổi link rút gọn vào đây) -->
    <button class="btn" onclick="location.href='https://linkvertise.com'">GET KEY</button>
    
    <div id="userKeyBox" class="key-box">Key của bạn: ssaa_...</div>

    <!-- Nút Admin -->
    <button class="admin-btn" onclick="openAdmin()">ADMIN PANEL</button>
</div>

<script>
    // Thuật toán giả lập tạo key theo giờ giống hệt trong game
    function getHourlyKey() {
        const blockTime = Math.floor(Date.now() / 1000 / 3600);
        const secretCode = (blockTime * 16253) % 90000 + 10000;
        return "ssaa_" + secretCode;
    }

    // Hiển thị key giờ tự động cho người dùng bình thường
    document.getElementById("userKeyBox").innerText = "Key của bạn: " + getHourlyKey();
    document.getElementById("userKeyBox").style.display = "block";

    function openAdmin() {
        let pass = prompt("Nhập mật khẩu Admin:");
        if (pass === "nah'iwin") {
            let adminPass2 = prompt("Nhập mật khẩu Admin Key (helloworldnah'iwin):");
            if (adminPass2 === "helloworldnah'iwin") {
                alert("Key vĩnh viễn của bạn là: ssaa_16253");
            } else {
                alert("Sai mật khẩu Admin Key! Key giờ hiện tại là: " + getHourlyKey());
            }
        } else {
            alert("Sai mật khẩu Admin!");
        }
    }
</script>

</body>
</html>
